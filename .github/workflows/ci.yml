name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      # The Flutter version comes from apps/nexus_bridges/pubspec.yaml, so CI
      # and every developer machine use exactly the same one.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/nexus_bridges/pubspec.yaml
          # No cache: restoring it took longer than installing Flutter (measured on 2026-10-20).

      # One pub get at the root resolves the whole workspace.
      - run: flutter pub get

      - name: Test nexus_bridges_core
        run: dart test --total-shards 4 --shard-index ${{ matrix.shard }}
        working-directory: packages/nexus_bridges_core

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/nexus_bridges/pubspec.yaml

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze

      - name: Test the app
        run: flutter test
        working-directory: apps/nexus_bridges

  checks:
    needs: [core, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        run: |
          [ "${{ needs.core.result }}" = "success" ] && [ "${{ needs.app.result }}" = "success" ]

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/nexus_bridges/pubspec.yaml

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build the installer
        run: ./tool/build-installer.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: NexusBridges-Setup
          path: installer/Output/*.exe
          if-no-files-found: error

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits of a PR through the API
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so gitleaks scans every commit

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
